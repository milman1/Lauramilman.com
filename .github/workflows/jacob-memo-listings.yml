# Publish Jacob & Co. memo watches as ACTIVE (photos later).
name: Jacob memo listings

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes to Shopify)'
        type: boolean
        default: true

concurrency:
  group: jacob-memo-listings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lmny-feeds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lmny-feeds/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Create listings
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_LOCATION_ID: ${{ vars.SHOPIFY_LOCATION_ID }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN_INPUT" = "false" ]; then
            npx tsx scripts/create-jacob-memo-listings.ts
          else
            npx tsx scripts/create-jacob-memo-listings.ts --dry-run
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacob-memo-listings
          path: lmny-feeds/out/jacob-memo-listings.json
          if-no-files-found: ignore
