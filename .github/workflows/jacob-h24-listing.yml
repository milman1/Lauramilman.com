# Rewrite the live Jacob & Co. H-24 listing to the watch schema and
# publish the Jacob & Co. Watches collection used by the Timepieces dropdown.
name: Jacob H-24 listing

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes to Shopify)'
        type: boolean
        default: true

concurrency:
  group: jacob-h24-listing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lmny-feeds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lmny-feeds/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Update H-24 listing and Jacob collection
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN_INPUT" = "false" ]; then
            npx tsx scripts/fix-jacob-h24-listing.ts
          else
            npx tsx scripts/fix-jacob-h24-listing.ts --dry-run
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacob-h24-listing
          path: lmny-feeds/out/jacob-h24-listing.json
          if-no-files-found: ignore
