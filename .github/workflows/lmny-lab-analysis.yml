# One-shot, read-only analysis of the Belgium Dia lab feed for the lab
# go-live decision. Deliberately given no Shopify credentials — it cannot
# write to the store, only fetch and report.
name: LMNY lab feed analysis

on:
  workflow_dispatch:
  # The session's GitHub integration can't call the dispatch API, so pushes
  # touching the analysis itself also run it. Read-only either way.
  push:
    branches: [main]
    paths:
      - 'lmny-feeds/src/lab-analysis.ts'
      - '.github/workflows/lmny-lab-analysis.yml'
      - 'lmny-feeds/cloudflare-worker/**'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    # A wedged runner shouldn't sit burning minutes for hours.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lmny-feeds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lmny-feeds/package-lock.json

      - run: npm ci

      # Compares SHA-256 fingerprints (never the keys) of GitHub's copy and
      # the one the worker is actually using. The worker adopts the key it is
      # handed once that key proves out upstream, so this both triggers the
      # adoption and confirms it. Page 2 is the cheap trigger: it passes the
      # auth gate but the worker answers it from itself, spending nothing.
      # Retries briefly while a fresh worker deploy propagates, but never
      # holds up the analysis: this is a diagnostic, not a gate.
      #
      # CAVEAT: on the very push that changes the worker, this will report
      # DIFFER — Cloudflare's git build takes minutes and this run starts in
      # seconds, so it reads the OLD worker. A worker change is confirmed by
      # the NEXT run, not its own.
      - name: Verify feed cache key
        continue-on-error: true
        timeout-minutes: 3
        env:
          BELGIUMDIA_API_KEY: ${{ secrets.BELGIUMDIA_API_KEY }}
          BELGIUMDIA_API_URL: ${{ vars.BELGIUMDIA_API_URL }}
        run: |
          gh_sha=$(printf %s "$BELGIUMDIA_API_KEY" | sha256sum | cut -c1-12)
          echo "github-key-sha=$gh_sha"
          if [ -z "$BELGIUMDIA_API_URL" ]; then
            echo "No BELGIUMDIA_API_URL set — sync reads the supplier directly."
            exit 0
          fi
          for attempt in 1 2 3; do
            curl -s -o /dev/null --max-time 10 --connect-timeout 5 \
              "$BELGIUMDIA_API_URL/api/developer-api/diamond?type=natural&page=2&key=$BELGIUMDIA_API_KEY" || true
            wk_sha=$(curl -s --max-time 10 --connect-timeout 5 "$BELGIUMDIA_API_URL/__keyhash" | tr -d '\r\n' || true)
            echo "attempt $attempt: worker-key-sha=${wk_sha:-<no answer>}"
            if [ "$gh_sha" = "$wk_sha" ]; then
              echo "VERDICT: keys MATCH — the cache is authorized to serve"
              # Matching keys only prove the gate opens. Freshness per feed is
              # what says the cache actually holds data the sync can read.
              echo "--- cache contents (fetchedAt / bytes per feed) ---"
              curl -s --max-time 15 --connect-timeout 5 \
                "$BELGIUMDIA_API_URL/__status?key=$BELGIUMDIA_API_KEY" || true
              exit 0
            fi
            [ "$attempt" = 3 ] || sleep 15
          done
          echo "VERDICT: keys still DIFFER."
          echo "Either the Cloudflare API_KEY still holds a different value, or"
          echo "the supplier key was rotated on one side only — if Cloudflare now"
          echo "has a NEW key, the GitHub BELGIUMDIA_API_KEY secret needs it too."
          echo "Not fatal: the sync falls back to the supplier directly."

      - name: Analyze lab feed
        env:
          BELGIUMDIA_API_KEY: ${{ secrets.BELGIUMDIA_API_KEY }}
          BELGIUMDIA_API_URL: ${{ vars.BELGIUMDIA_API_URL }}
        run: npx tsx src/lab-analysis.ts

      - name: Publish report
        if: always()
        run: cat out/lab-analysis.md >> "$GITHUB_STEP_SUMMARY" || echo "No report generated" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmny-lab-analysis-${{ github.run_id }}
          path: lmny-feeds/out/lab-analysis.md
          if-no-files-found: ignore
