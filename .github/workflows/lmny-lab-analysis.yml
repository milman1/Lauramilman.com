# One-shot, read-only analysis of the Belgium Dia lab feed for the lab
# go-live decision. Deliberately given no Shopify credentials — it cannot
# write to the store, only fetch and report.
name: LMNY lab feed analysis

on:
  workflow_dispatch:
  # The session's GitHub integration can't call the dispatch API, so pushes
  # touching the analysis itself also run it. Read-only either way.
  push:
    branches: [main]
    paths:
      - 'lmny-feeds/src/lab-analysis.ts'
      - '.github/workflows/lmny-lab-analysis.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lmny-feeds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lmny-feeds/package-lock.json

      - run: npm ci

      # Prints SHA-256 fingerprints (never the keys) of GitHub's copy and the
      # worker's copy, so a mismatch names its side. Retries while a fresh
      # worker deploy propagates.
      - name: Key diagnostics
        env:
          BELGIUMDIA_API_KEY: ${{ secrets.BELGIUMDIA_API_KEY }}
          BELGIUMDIA_API_URL: ${{ vars.BELGIUMDIA_API_URL }}
        run: |
          echo "github-key-sha=$(printf %s "$BELGIUMDIA_API_KEY" | sha256sum | cut -c1-12)"
          if [ -n "$BELGIUMDIA_API_URL" ]; then
            for i in $(seq 1 6); do
              h=$(curl -s --max-time 15 "$BELGIUMDIA_API_URL/__keyhash" || true)
              case "$h" in
                [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f])
                  echo "worker-key-sha=$h"; break;;
                *) echo "worker keyhash not ready (attempt $i): $h"; sleep 20;;
              esac
            done
          fi

      - name: Analyze lab feed
        env:
          BELGIUMDIA_API_KEY: ${{ secrets.BELGIUMDIA_API_KEY }}
          BELGIUMDIA_API_URL: ${{ vars.BELGIUMDIA_API_URL }}
        run: npx tsx src/lab-analysis.ts

      - name: Publish report
        if: always()
        run: cat out/lab-analysis.md >> "$GITHUB_STEP_SUMMARY" || echo "No report generated" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmny-lab-analysis-${{ github.run_id }}
          path: lmny-feeds/out/lab-analysis.md
          if-no-files-found: ignore
