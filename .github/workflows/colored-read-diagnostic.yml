name: Colored feed read diagnostic
on:
  pull_request:
    paths: ['.github/workflows/colored-read-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare stored source-owned fields without logging values
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          LGD_API_KEY: ${{ secrets.LGD_API_KEY }}
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import {fetchInventory,normalizeFeed,payloadFor,snapshotHash} from './lmny-feeds/src/lgd-color/catalog.mjs';
          import {requestShopify,OPS} from './lmny-feeds/src/lgd-color/sync.mjs';
          try {
            const domain=process.env.SHOPIFY_STORE_DOMAIN;
            const response=await fetch('https://'+domain+'/admin/oauth/access_token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grant_type:'client_credentials',client_id:process.env.SHOPIFY_CLIENT_ID,client_secret:process.env.SHOPIFY_CLIENT_SECRET})});
            const token=(await response.json()).access_token;
            if(!token)throw new Error('No token');
            const stones=normalizeFeed(await fetchInventory(process.env.LGD_API_KEY)).stones;
            const data={products:{nodes:[]}}; let after=null,more=true;
            while(more){const page=await requestShopify(domain,token,OPS.catalog,{query:'tag:colored-stone-feed',after});data.products.nodes.push(...page.products.nodes);after=page.products.pageInfo.endCursor;more=page.products.pageInfo.hasNextPage;}
            const failed=new Set();
            for(const p of data.products.nodes){
              const s=stones.find(s=>s.handle===p.handle); if(!s)continue;
              const v=p.variants.nodes[0],ready=p.media.nodes.some(m=>m.status==='READY'&&m.mediaContentType==='IMAGE');
              const expected=payloadFor(s,{...p,variantId:v.id,readyImage:ready},p.status);
              const flags={price:Number(v.price)===Number(expected.variants[0].price),sku:v.sku===s.stock,certificate:p.certificate?.value===s.certificate,video:p.video?.value===s.video,title:p.title===expected.title,template:p.templateSuffix==='diamond',hash:p.hash?.value===snapshotHash(s),cost:Number(v.inventoryItem.unitCost?.amount)===Number(expected.variants[0].inventoryItem.cost),tracked:v.inventoryItem.tracked===true,quantity:v.inventoryQuantity===0,tags:!p.tags.includes('ebay')&&!p.tags.includes('lmny-feed')};
              for(const k of Object.keys(flags))if(!flags[k])failed.add(k);
              if(v.price!==expected.variants[0].price)failed.add('money_format');
            }
            const messages={price:'PRICE_COMPARISON_FAILED',sku:'SKU_COMPARISON_FAILED',certificate:'CERTIFICATE_COMPARISON_FAILED',video:'VIDEO_COMPARISON_FAILED',title:'TITLE_COMPARISON_FAILED',template:'TEMPLATE_COMPARISON_FAILED',hash:'HASH_COMPARISON_FAILED',cost:'COST_COMPARISON_FAILED',tracked:'TRACKING_COMPARISON_FAILED',quantity:'QUANTITY_COMPARISON_FAILED',tags:'SOURCE_TAG_COMPARISON_FAILED',money_format:'MONEY_STRING_FORMAT_DIFFERS'};
            for(const k of failed)console.log(messages[k]);
            console.log('Read-only comparisons completed; no product identifiers or values logged.');
          } catch { console.error('Diagnostic failed; no credentials or supplier values are logged.'); process.exitCode=1; }
          JS
