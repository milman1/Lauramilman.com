# LMNY Belgium Dia → Shopify feed sync.
#
# Lives alongside the theme without touching theme deploys (the Shopify
# GitHub integration only syncs theme directories).
#
# Write gating:
#   - pull_request runs are ALWAYS --dry-run (safe CI signal on the sync PR)
#   - workflow_dispatch: dry_run input defaults to true; untick it for a live run
#   - scheduled runs are dry-run until the repo variable LMNY_SYNC_LIVE=true
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   SHOPIFY_STORE_DOMAIN, SHOPIFY_ADMIN_TOKEN, BELGIUMDIA_API_KEY,
#   HOURS_API_URL, HOURS_API_KEY
# Optional variable: BELGIUMDIA_API_URL (overrides the default feed base URL)
name: LMNY feed sync

on:
  schedule:
    # 05:17 ET daily. Deliberately off the top of the hour: GitHub's scheduler
    # is best-effort and drops/delays runs most often at :00, the busiest slot.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes to Shopify)'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'lmny-feeds/**'
      - '.github/workflows/lmny-feed-sync.yml'

concurrency:
  group: lmny-feed-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lmny-feeds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lmny-feeds/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Run sync
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          # Shopify auth: set SHOPIFY_ADMIN_TOKEN (shpat_…) OR the Dev Dashboard
          # app pair SHOPIFY_CLIENT_ID + SHOPIFY_CLIENT_SECRET (exchanged at runtime).
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          BELGIUMDIA_API_KEY: ${{ secrets.BELGIUMDIA_API_KEY }}
          BELGIUMDIA_API_URL: ${{ vars.BELGIUMDIA_API_URL }}
          HOURS_API_URL: ${{ secrets.HOURS_API_URL }}
          HOURS_API_KEY: ${{ secrets.HOURS_API_KEY }}
          # Which feeds to process. Defaults to natural-only in code when unset.
          # Live writes require BOTH LMNY_SYNC_LIVE=true AND the feed listed here.
          SYNC_FEEDS: ${{ vars.SYNC_FEEDS }}
          EVENT: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          LIVE_VAR: ${{ vars.LMNY_SYNC_LIVE }}
        run: |
          if { [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "false" ]; } \
             || { [ "$EVENT" = "schedule" ] && [ "$LIVE_VAR" = "true" ]; }; then
            echo "Mode: LIVE"
            npx tsx src/sync.ts
          else
            echo "Mode: dry run"
            npx tsx src/sync.ts --dry-run
          fi

      - name: Publish run summary
        if: always()
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report generated" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmny-sync-report-${{ github.run_id }}
          path: |
            lmny-feeds/out/report.json
            lmny-feeds/out/report.md
          if-no-files-found: ignore
